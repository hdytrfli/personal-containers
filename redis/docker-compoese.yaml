services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - 6379:6379
    volumes:
      - redis:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - 5540:5540
    depends_on:
      - redis
    volumes:
      - redisinsight:/data
    restart: unless-stopped

volumes:
  redis:
  redisinsight:

networks:
  default:
    name: local
    external: true